<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F4E4C6">
  <title>BRAVO — Interactive Prototype</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="wireframe.css">
</head>
<body>
  <a class="skip-link" href="#app">Skip to content</a>
  <header class="site-header">
    <a class="brand" href="#home" aria-label="BRAVO home">BRAVO</a>
    <button class="menu-button" type="button" aria-expanded="false" aria-controls="primary-nav">Menu</button>
    <nav class="primary-nav" id="primary-nav" aria-label="Primary navigation">
      <a href="#projects" data-route="projects">Projects</a>
      <a href="#journal" data-route="journal">Journal</a>
      <a href="#studio" data-route="studio">About</a>
      <a href="#contact" data-scroll-contact>Contact</a>
    </nav>
  </header>

  <main id="app" tabindex="-1"></main>

  <footer class="site-footer" id="contact">
    <div class="contact-footer">
      <div class="contact-brand">BRAVO</div>
      <div class="contact-footer-grid">
        <div class="contact-social"><span>Social media</span><div><a href="#">Instagram</a><a href="#">LinkedIn</a></div></div>
        <div class="contact-inquiries">
          <div><span>New business &amp; general inquiries</span><a href="mailto:hello@BRAVO.company">hello@BRAVO.company</a></div>
          <div><span>Editorial illustration commissions</span><a href="mailto:editorial@BRAVO.company">editorial@BRAVO.company</a></div>
          <div><span>Job applications</span><a href="mailto:apply@BRAVO.company">apply@BRAVO.company</a></div>
        </div>
      </div>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
